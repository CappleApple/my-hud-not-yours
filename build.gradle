plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            if (project.hasProperty('quickPlayWorld')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlayWorld').toString()
            }
            if (project.hasProperty('autoOpenEditor')) {
                systemProperty 'myhudnotyours.autoOpenEditor', 'true'
            }
            if (project.hasProperty('autoOpenTextureBrowser')) {
                systemProperty 'myhudnotyours.autoOpenTextureBrowser', 'true'
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:deprecation')
}

def releaseJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
tasks.register('verifyReleaseJarContents') {
    dependsOn tasks.named('jar')
    inputs.file(releaseJar)
    doLast {
        def zip = new java.util.zip.ZipFile(releaseJar.get().asFile)
        try {
            [
                'META-INF/neoforge.mods.toml',
                'myhudnotyours.mixins.json',
                'assets/myhudnotyours/lang/en_us.json',
                'com/cappleapple/myhudnotyours/MyHudNotYours.class'
            ].each { entry ->
                if (zip.getEntry(entry) == null) {
                    throw new GradleException("Missing required JAR entry: ${entry}")
                }
            }
            def staleEntries = zip.entries().findAll { entry ->
                entry.name == 'elementsnotscreens.mixins.json'
                    || entry.name.startsWith('assets/elementsnotscreens/')
                    || entry.name.startsWith('com/cappleapple/elementsnotscreens/')
            }
            if (!staleEntries.isEmpty()) {
                throw new GradleException("Release JAR still contains the previous mod identity")
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyReleaseJarContents')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
